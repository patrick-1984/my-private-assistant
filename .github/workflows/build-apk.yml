# Build APK - manual release build for TV Voice Search.
#
# This workflow runs ONLY when started by hand (Actions -> "Build APK" -> Run workflow).
# It has no push, tag or pull-request triggers, so committing it starts nothing.
#
# Inputs:
#   version  - version label for the artifact and release, e.g. 1.0.1
#   publish  - when true, also create the GitHub release v<version> with the APK and SHA256SUMS
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  - the upload keystore (.jks), base64-encoded (key alias must be "upload")
#   ANDROID_STORE_PASSWORD   - keystore password
#   ANDROID_KEY_PASSWORD     - key password
#
# app/build.gradle.kts reads KEYSTORE_PATH, STORE_PASSWORD and KEY_PASSWORD from the environment.
# Its signingConfigs block is required by Google AI Studio and must not be changed.
# The app's versionName / versionCode come from app/build.gradle.kts; the input version only names
# the APK file and the release tag.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 1.0.1"
        required: true
        type: string
      publish:
        description: "Create GitHub release v<version> with the APK"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Input 'version' must look like 1.0.1 (got '$VERSION')."
            exit 1
          fi

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_STORE_PASSWORD"
          [ -n "$K_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings -> Secrets and variables -> Actions (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package no longer exists; AGP downloads the compile SDK it needs.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi

      - name: Create throwaway debug keystore
        # debug.keystore is git-ignored; the debug signingConfig expects it at the repo root.
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK and write SHA256SUMS
        run: |
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK found under app/build/outputs/apk/release."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          cp "$apk" "dist/tv-voice-search-${VERSION}.apk"
          (cd dist && sha256sum "tv-voice-search-${VERSION}.apk" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify APK (signature, SDK levels, CPU support)
        run: |
          apk="dist/tv-voice-search-${VERSION}.apk"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | grep -E 'Verified using|Signer #1 certificate (DN|SHA-256)'
          "$bt/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-feature|leanback-launchable)" || true
          libs="$(unzip -l "$apk" | awk '{print $4}' | grep '^lib/' || true)"
          {
            echo "## APK check"
            echo
            if [ -z "$libs" ]; then
              echo "No native libraries: one universal APK runs on armeabi-v7a (32-bit), arm64-v8a (64-bit) and x86/x86_64 devices."
            else
              echo "Native libraries found:"
              echo '```'
              echo "$libs"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > dist/APK-CHECK.md

      - name: Remove keystores
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" debug.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: tv-voice-search-${{ inputs.version }}
          path: |
            dist/tv-voice-search-${{ inputs.version }}.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TV Voice Search ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body_path: dist/APK-CHECK.md
          files: |
            dist/tv-voice-search-${{ inputs.version }}.apk
            dist/SHA256SUMS
